{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>프로젝트와 작업 상태를 관리합니다</h1>
    {% if user %}
      <p>로그인 상태입니다. 작업 화면에서 프로젝트를 만들고 작업을 완료할 수 있습니다.</p>
      <a class="button" href="/app">작업 화면으로 이동</a>
    {% else %}
      <p>로그인 전에는 핵심 기능에 접근할 수 없습니다.</p>
      <a class="button" href="/login">로그인</a>
    {% endif %}
  </section>
{% endblock %}
