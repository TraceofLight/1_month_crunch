<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nginx on localhost:4000</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7fa, #dfe7f1);
        color: #17212b;
      }

      main {
        width: min(640px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 60px rgba(23, 33, 43, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      code {
        padding: 2px 6px;
        border-radius: 999px;
        background: #eef3f8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nginx is running</h1>
      <p>
        This page is bundled from <code>app/</code> inside the Docker image and
        exposed through <code>localhost:4000</code>.
      </p>
    </main>
  </body>
</html>
